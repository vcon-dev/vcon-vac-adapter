services:
  vcon_vac_adapter:
    build: .
    container_name: vcon_vac_adapter
    ports:
      - "8000:8000"
    volumes:
      - ./vcons:/app/vcons
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
