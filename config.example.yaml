# vcon-vac-adapter configuration
# All ${ENV_VAR} placeholders are substituted at startup.

adapter:
  name: vac
  # One of: claude_code | anthropic | openai_responses | openai_agents
  source_platform: claude_code

# Source platform configuration
source:
  # Claude Code: tail JSONL files under projects_dir
  claude_code:
    projects_dir: ${HOME}/.claude/projects
  # Anthropic / OpenAI Responses: directory of {request, response} JSON pairs
  anthropic:
    logs_dir: /var/log/agent/anthropic
  openai_responses:
    logs_dir: /var/log/agent/openai
  # OpenAI Agents SDK: live trace processor (set live=true and import the
  # processor module in your agent process)
  openai_agents:
    live: false

# vCon construction
vcon:
  syntax: "0.4.0"
  # Extensions this adapter always emits
  extensions:
    - agent_session
  # VAC record encoding
  vac_encoding: json          # json | cbor
  # Trace granularity: one per session (default) or one per tool call
  granularity: session        # session | per_tool_call
  # Add "agent_session" to vCon critical[] if downstream MUST honor it
  critical_agent_session: false
  # Synthetic / test data only: emit lawful_basis attachment
  include_lawful_basis: false
  # Optional: JWS signing
  signing:
    enabled: false
    private_key_path: ${VCON_SIGNING_KEY_PATH}
    key_id: ${VCON_SIGNING_KEY_ID}

# Webhook delivery
webhook:
  endpoints:
    - url: ${VCON_WEBHOOK_URL}
      hmac_secret: ${VCON_WEBHOOK_HMAC_SECRET}
      timeout_seconds: 30
  retry:
    max_attempts: 5
    initial_backoff_seconds: 1
    max_backoff_seconds: 60
  dead_letter_path: /app/vcons/dlq

# Local filesystem storage (optional)
storage:
  enabled: true
  path: /app/vcons
  filename_pattern: "{uuid}.vcon.json"

# Observability
server:
  host: 0.0.0.0
  port: 8000

logging:
  level: INFO
  format: json
